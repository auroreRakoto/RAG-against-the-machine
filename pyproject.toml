[project]
name = "rag-against-the-machine"
version = "0.1.0"
description = "A local Retrieval-Augmented Generation system for the vLLM codebase."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fire>=0.7.1",
    "flake8>=7.0.0",
    "mypy>=1.10.0",
    "pydantic>=2.13.4",
    "pytest>=8.3.5",
    "rank-bm25>=0.2.2",
    "torch>=2.12.1",
    "tqdm>=4.66.0",
    "transformers>=5.13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["data/raw"]

[tool.mypy]
exclude = [
    "^\\.venv/",
    "^data/raw/",
]
